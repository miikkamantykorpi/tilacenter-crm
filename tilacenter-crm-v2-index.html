<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102D22"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="TilaCenter CRM"><title>TilaCenter CRM</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f4;color:#17201b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:430px;margin:auto;min-height:100vh;padding-bottom:94px}.head{background:#102d22;color:white;padding:calc(18px + env(safe-area-inset-top)) 20px 20px;border-radius:0 0 28px 28px}.brand{font-size:11px;letter-spacing:.22em;opacity:.65;font-weight:700}.row{display:flex;justify-content:space-between;align-items:center}.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#ffffff18;font-weight:700}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.tabs button,.btn{border:0;border-radius:13px;padding:12px;font-weight:650}.tabs button{background:#ffffff18;color:white}.tabs .on{background:white;color:#102d22}.pad{padding:20px}.voice{width:100%;background:white;border:1px solid #0000000c;border-radius:24px;padding:18px;display:flex;align-items:center;gap:14px;text-align:left;box-shadow:0 2px 8px #00000008}.mic{width:62px;height:62px;border-radius:50%;background:#e4f0e9;color:#16704a;display:grid;place-items:center;font-size:26px}.small{font-size:13px;color:#0008}.list{display:grid;gap:10px}.card{background:white;border:1px solid #0000000c;border-radius:17px;padding:15px}.case{display:grid;grid-template-columns:42px 1fr auto;gap:11px;align-items:center;cursor:pointer}.ico{width:40px;height:40px;border-radius:12px;background:#edf0ec;display:grid;place-items:center;font-weight:800}.badge{font-size:10px;padding:4px 7px;border-radius:6px;background:#e7eee9;color:#385044;font-weight:800}.status{font-size:11px;max-width:95px;text-align:right}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;background:white;border-top:1px solid #0001;display:flex;justify-content:space-around;padding:10px 4px calc(12px + env(safe-area-inset-bottom));z-index:5}.nav button{border:0;background:none;font-size:11px;color:#0008}.nav .on{color:#126a46;font-weight:800}.search{width:100%;padding:15px;border-radius:15px;border:1px solid #0002;font-size:16px}.back{background:none;border:0;color:white;padding:0}.detailhead{border-radius:0}.title2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#0006;font-weight:800}.fab{width:100%;background:#143a2b;color:white}.modal{position:fixed;inset:0;background:#0006;z-index:10;display:flex;align-items:flex-end;justify-content:center}.sheet{max-width:430px;width:100%;background:white;border-radius:28px 28px 0 0;padding:22px 20px calc(28px + env(safe-area-inset-bottom))}.hidden{display:none}h1{margin:4px 0 0;font-size:25px}h2{margin:20px 0 12px}p{margin:5px 0}.next{font-weight:700}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style><meta name="application-name" content="TilaCenter CRM"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"></head><body><main id="app" class="app"></main><script>
const seed=[
['GVR Finland','Pirkkala · tarve 1 200 m² · tontti ~5 000 m²','Todennäköisesti jatkaa nykytiloissa; voi vielä tarjota','LEADS','Konkreettinen ehdotus nopeasti · status Ethosilla'],
['Jotel','Pirkkala/Tampere · tuotantotilatarve','Status annettu Ethosille','LEADS','Vehnämyllynkatu 12 B vielä tarjoamatta','Tommi Mäkelä · +358 40 516 9935 · tommi.makela@jotel.com','Ilkontie 1, Kangasala · Vestonkatu 15, Tampere'],
['Medanta','Pirkkala · toimisto 200 m² + halli 1 800 m²','Mukana jos hallitus hyväksyy uudisrakentamisen','LEADS','Eteneminen Ethosin kautta','Karolina Eroma · CEO · +358 44 042 6551 · karolina.eroma@medanta.fi','Vaittintie 13, Pirkkala'],
['Amexci Oy','Pirkkala · ~1 500 m² · Katakri','Palaveri pidetty · kiinnostunut Destia-hankkeesta','LEADS','Seuraa Destia/Ethos etenemistä','+358 40 549 09 43 · info@amexci.com','Ajurintaival 10, Lempäälä'],
['AGCO Power','Nokia · tarve ~6 000 m²','Nosturikatu 10/16 selvityksessä','LEADS','Varmista tekniset vaatimukset ja kilpailijarajoite'],
['Yellow Service','Autovarikonkatu 15 · ~1 700 m²','Vuokralainen · kohdetta mietitty Ethosille','LEADS','Omistajalle ei vielä soitettu'],
['Leivon Leipomo','Pirkkala · laajennus / kehityshanke','Case Ethosilla · hallituskäsittely','LEADS','Seuraa Pekka Vihman hallituskäsittelyä'],
['Nomet Oy','Pukinekatu 1 & 5 · >5 500 m²','Sale-leaseback kiinnostus','LEADS','Jatka S&LB-kartoitusta','Mika Kivimäki · toimitusjohtaja · +358 50 597 9849','Pukinekatu 1, Tampere'],
['MEP-Steel','Metallitie 1 · ~2 000 m²','Yrityskauppa · tilat jäävät myyjille','LEADS','Varmista vuokralle jääminen'],
['Nekapaino','Golfkentäntie 4 · 1 200 m² + rakennusoikeus','Myyjä haluaa jäädä vuokralle','LEADS','Arvioi S&LB / 2 200 m² vaihtoehto','Tero Pinomäki · toimitusjohtaja · +358 40 590 0252','Golfkentäntie 4, Pirkkala'],
['Recset Oy','Polunmäenkatu 29 · 5/7/10 v tarjous','Tarjous lähetetty','VÄLITYS','Odota vastausta','Riku Vainiokangas · toimitusjohtaja · +358 40 549 7981','Viinikankatu 47, Tampere'],
['Kipox Oy','Betonitie 3 · Ylöjärvi · 1 152 m²','Vuokra 9 000 €/kk + alv · 60 kk','VÄLITYS','Sopimus alkaa 1.1.2027'],
['Clean Trade Oy','Huppionmäenkatu 7 A1 · 310 m²','Tarjous 2 890 €/kk + vastike','VÄLITYS','Kysy Logistilalta tarjouksen status'],
['Annanmaankuja 2','Pirkkala · rakennus ~2 000 m² · tontti ~5 000 m²','Toimeksianto: vuokralaiset ja ostajat','VÄLITYS','Ethos ostajana · Medanta uudiskäyttäjäehdokas'],
['Ajurintaival 4','Kohde · nettotuotto ~184 000 €/v','Ethos käynyt katsomassa kehitysmielessä','LEADS','Tee Ethos-esitys'],
['Vehnämyllynkatu 12','Tampere · ~500 m² toimisto + ~3 000 m² teollisuus','Ethos ostamassa','LEADS','Tarjoa Jotelille B-vaihtoehto'],
['Nosturikatu 10 & 16','Nokia · kokonaisuus ~12 800 m²','AGCO-vaihtoehto','LEADS','Selvitä soveltuvuus'],
['Teollisuustie 27–31','Pirkkala · ~4 ha · Destia/GVR','Destia-hankkeen Ethos-tarjous etenee','LEADS','Seuraa Destian päätöstä'],
['Jasperintie','Pirkkala · 1 460–1 747 m²','Mahdollinen käyttöönotto 1/2028','VÄLITYS','Pidä kohde vaihtoehtona'],
['Aunankorvenkatu 6','Tampere · ~1 450 m²','Omistuskohde / vuokralaisia','VÄLITYS','Pidä kohdetietokannassa'],
['Telinetie 7','507,5 m² · halli ~380 m²','Kohde','VÄLITYS','Pidä kohdetietokannassa'],
['Menotie 1B / Tavaratila','Ylöjärvi · kehityshanke 2027–2029','Vaiheistus Normi Opaste / Aventi / TamTurbo','VÄLITYS','Kehityssuunnitelma ja vuokraukset'],
['Hedvi Markkinointi Oy','Turku · pakkanen 600 m² + viileä 400 m²','Tilatarve','LEADS','Etsi kehätien varresta'],
['Piikkio Works','Turku · toimistotarve 1 000 m²','Tilatarve','LEADS','Jatka vaihtoehtojen hakua']
].map((x,i)=>({id:i+1,name:x[0],detail:x[1],status:x[2],type:x[3],next:x[4],contact:x[5]||'',address:x[6]||''}));
let cases=JSON.parse(localStorage.getItem('tc_cases')||'null')||seed, page='Etusivu', tab='Kaikki', selected=null, query='';
const save=()=>localStorage.setItem('tc_cases',JSON.stringify(cases)); const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function header(){return `<header class="head"><div class="row"><div><div class="brand">TILACENTER</div><h1>${page}</h1></div><div class="avatar">MM</div></div>${page!='Tehtävät'?`<div class="tabs">${['Kaikki','Leads','Välitys'].map(x=>`<button class="${tab==x?'on':''}" onclick="tab='${x}';render()">${x}</button>`).join('')}</div>`:''}</header>`}
function filtered(){return cases.filter(c=>(tab=='Kaikki'||c.type==tab.toUpperCase())&&(!query||[c.name,c.detail,c.status,c.next,c.contact,c.address].join(' ').toLowerCase().includes(query.toLowerCase())))}
function list(arr){return `<div class="list">${arr.map(c=>`<div class="card case" onclick="selected=${c.id};render()"><div class="ico">${esc(c.name[0])}</div><div><b>${esc(c.name)}</b> <span class="badge">${c.type}</span><div class="small">${esc(c.detail)}</div></div><div class="status">${esc(c.status)}</div></div>`).join('')}</div>`}
function detail(c){return `<header class="head detailhead"><button class="back" onclick="selected=null;render()">‹ Takaisin</button><h1>${esc(c.name)}</h1></header><div class="pad"><div class="card"><span class="badge">${c.type}</span><h2>${esc(c.detail)}</h2><p class="small">${esc(c.status)}</p></div>${c.contact?`<div class="card"><div class="title2">Yhteyshenkilö</div><p>${esc(c.contact)}</p></div>`:''}${c.address?`<div class="card"><div class="title2">Osoite / toimipiste</div><p>${esc(c.address)}</p></div>`:''}<div class="card"><div class="title2">Seuraava toimenpide</div><p class="next">${esc(c.next)}</p></div><div class="card"><div class="title2">Tapahtumat</div><p>Viimeisin päivitys · puhelut, tarjoukset ja kommentit kootaan tähän.</p></div><button class="btn fab" onclick="voice()">● Puhu päivitys</button></div>`}
let voiceDraft={text:'',intent:'',caseId:null};
function classifyVoice(t){const s=t.toLowerCase(),dev=['väri','ulkoasu','rakenne','kortti','nappi','painike','välilehti','fontti','layout','käyttöliittym','piilota','siirrä','isompi','pienempi','tausta','kehitys','muuta sovell','muuta app','lisää appiin'],crm=['tarjott','kiinnost','vuokra','myynt','soitti','palataan','follow','muistuta','tarvitsee','tilatarve','kohde','sopimus','ethos','asiakas','liidi','neuvottel'];let d=dev.filter(k=>s.includes(k)).length,c=crm.filter(k=>s.includes(k)).length;return d>c?'DEV':c>d?'CRM':'UNCLEAR'}
function findCaseFromText(t){const s=t.toLowerCase();return cases.find(c=>s.includes(c.name.toLowerCase().replace(' oy','')))||(selected?cases.find(c=>c.id==selected):null)}
function voice(){document.body.insertAdjacentHTML('beforeend',`<div id="modal" class="modal"><div class="sheet"><div class="row"><div><div class="title2">PUHEOHJAUS</div><h2 style="margin:6px 0">Puhu CRM:lle</h2></div><button class="btn" onclick="modal.remove()">✕</button></div><p class="small">Sano normaalisti CRM-päivitys tai sovelluksen kehitysidea. Tunnistan tarkoituksen automaattisesti.</p><div id="listenState" class="card" style="text-align:center;margin-top:14px"><div class="mic" style="margin:auto">●</div><b id="listenTitle">Paina ja puhu</b><div class="small" id="listenHelp">Puhe tarkistetaan ennen tallennusta.</div></div><textarea id="note" class="search" style="min-height:90px;margin-top:12px" placeholder="Puhe ilmestyy tähän. Voit myös kirjoittaa."></textarea><button class="btn fab" style="width:100%;margin-top:12px" onclick="startSpeech()">● Aloita puhe</button><button class="btn" style="width:100%;margin-top:8px" onclick="reviewVoice()">Tarkista tulkinta</button></div></div>`)}
function startSpeech(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){listenTitle.textContent='Puheentunnistus ei ole käytettävissä';listenHelp.textContent='Kirjoita päivitys kenttään.';return}const r=new SR();r.lang='fi-FI';r.interimResults=true;r.continuous=false;listenTitle.textContent='Kuuntelen…';listenHelp.textContent='Puhu normaalisti.';r.onresult=e=>{let x='';for(let i=e.resultIndex;i<e.results.length;i++)x+=e.results[i][0].transcript;note.value=x};r.onerror=()=>{listenTitle.textContent='Puhe ei onnistunut';listenHelp.textContent='Yritä uudelleen tai kirjoita.'};r.onend=()=>{listenTitle.textContent='Puhe vastaanotettu';listenHelp.textContent='Paina Tarkista tulkinta.'};r.start()}
function reviewVoice(){const t=note.value.trim();if(!t)return;const intent=classifyVoice(t),c=findCaseFromText(t);voiceDraft={text:t,intent,caseId:c?c.id:null};if(intent==='UNCLEAR'){modal.querySelector('.sheet').innerHTML=`<div class="title2">TULKINTA EPÄVARMA</div><h2>Mitä tarkoitit?</h2><div class="card"><p>${esc(t)}</p></div><div class="two"><button class="btn" onclick="voiceDraft.intent='CRM';showReview()">CRM-päivitys</button><button class="btn fab" onclick="voiceDraft.intent='DEV';showReview()">Kehitysidea</button></div>`;return}showReview()}
function showReview(){const c=cases.find(x=>x.id==voiceDraft.caseId),isDev=voiceDraft.intent==='DEV';modal.querySelector('.sheet').innerHTML=`<div class="title2">${isDev?'KEHITYSIDEA':'CRM-PÄIVITYS'}</div><h2>Tarkista ennen tallennusta</h2><div class="card"><div class="title2">${isDev?'Sovelluksen muutosidea':'Tunnistettu päivitys'}</div><p>${esc(voiceDraft.text)}</p>${!isDev?`<div class="small">Case: ${c?esc(c.name):'ei tunnistettu'}</div>`:''}</div><div class="two"><button class="btn" onclick="modal.remove()">Peruuta</button><button class="btn fab" onclick="saveVoiceDraft()">${isDev?'Tallenna idea':'Tallenna CRM:ään'}</button></div>`}
function saveVoiceDraft(){if(voiceDraft.intent==='DEV'){const a=JSON.parse(localStorage.getItem('tc_devideas')||'[]');a.unshift({text:voiceDraft.text,date:new Date().toISOString(),status:'Uusi'});localStorage.setItem('tc_devideas',JSON.stringify(a))}else{let c=cases.find(x=>x.id==voiceDraft.caseId);if(c){c.status=voiceDraft.text;c.next='Tarkista jatkotoimi';save()}else{const a=JSON.parse(localStorage.getItem('tc_events')||'[]');a.unshift({text:voiceDraft.text,date:new Date().toISOString()});localStorage.setItem('tc_events',JSON.stringify(a))}}modal.querySelector('.sheet').innerHTML=`<div style="text-align:center;padding:25px 0"><div style="font-size:42px">✓</div><h2>${voiceDraft.intent==='DEV'?'Kehitysidea tallennettu':'CRM päivitetty'}</h2><p class="small">${voiceDraft.intent==='DEV'?'Idea erotettiin CRM-datasta.':'Päivitys tallennettiin.'}</p><button class="btn fab" onclick="modal.remove();render()">Valmis</button></div>`}
function render(){let a=document.getElementById('app');if(selected){a.innerHTML=detail(cases.find(x=>x.id==selected));return}let body='';if(page=='Etusivu')body=`<div class="pad"><button class="voice" onclick="voice()"><div class="mic">●</div><div><b style="font-size:18px">Puhu CRM:lle</b><div class="small">CRM-päivitys tai kehitysidea</div></div></button><h2>Avoimet caset</h2>${list(filtered())}</div>`;if(page=='Caset')body=`<div class="pad"><button class="btn fab" onclick="newCase()">+ Uusi case</button><h2>Avoimet caset</h2>${list(filtered())}</div>`;if(page=='Haku')body=`<div class="pad"><input class="search" value="${esc(query)}" oninput="query=this.value;render()" placeholder="Hae yritys, henkilö tai kohde…" autofocus><div style="margin-top:16px">${list(filtered())}</div></div>`;if(page=='Tehtävät')body=`<div class="pad">${cases.map(c=>`<div class="card" onclick="selected=${c.id};render()"><div class="small">${esc(c.name)}</div><b>${esc(c.next)}</b></div>`).join('')}</div>`;a.innerHTML=header()+body+`<nav class="nav">${['Etusivu','Caset','Haku','Tehtävät'].map((x,i)=>`<button class="${page==x?'on':''}" onclick="page='${x}';selected=null;render()"><div>${['⌂','▤','⌕','✓'][i]}</div>${x}</button>`).join('')}</nav>`}
function newCase(){let n=prompt('Yritys / case');if(!n)return;let c={id:Date.now(),name:n,detail:'Täydennä sijainti ja tilatarve',status:'Uusi',type:tab=='Välitys'?'VÄLITYS':'LEADS',next:'Ota yhteyttä',contact:'',address:''};cases.unshift(c);save();selected=c.id;render()}render();
</script></body></html>
